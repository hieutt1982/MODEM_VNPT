
name: MODEM_VNPT_APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: tool_vnpt
        run: npm install

      - name: Stage Node.js
        working-directory: tool_vnpt
        run: npm run stage:node

      - name: Sync Android
        working-directory: tool_vnpt
        run: npm run android:sync

      - name: Build APK
        working-directory: tool_vnpt
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MODEM_VNPT_APK
          path: tool_vnpt/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

