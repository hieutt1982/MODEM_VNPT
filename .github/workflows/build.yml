
name: MODEM_VNPT_APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tool_vnpt

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Cài Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Cài các thư viện Node.js
      - name: Install dependencies
        run: npm install

      # 5. Đóng gói Node.js modules
      - name: Stage Node.js
        run: npm run stage:node

      # 6. Tạo Android platform
      - name: Add Android platform
        run: npx cap add android

      # 7. Đồng bộ Capacitor
      - name: Sync Android
        run: npx cap sync android

      # 8. Build APK
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      # 9. Đưa APK lên GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MODEM_VNPT_APK
          path: tool_vnpt/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
