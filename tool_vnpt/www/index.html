<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151d"><title>VNPT Modem</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10151d;color:#f3f6fa;font:17px Arial;display:grid;place-items:center;padding:22px}.card{width:min(100%,500px);text-align:center;background:#1b2430;border:1px solid #344253;border-radius:20px;padding:26px}h1{font-size:26px}.status{color:#b9c6d5;line-height:1.5}.spin{width:30px;height:30px;border:3px solid #344253;border-top-color:#62a0ff;border-radius:50%;margin:20px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{padding:12px 18px;border:0;border-radius:10px;background:#3478f6;color:white;font-size:16px;font-weight:bold}</style></head><body><main class="card"><h1>VNPT Modem</h1><div id="status" class="status">Đang khởi động Node.js...</div><div class="spin"></div><button id="retry" hidden>Thử kết nối lại</button></main><script>(function(){const url='http://127.0.0.1:3001/';const s=document.getElementById('status'),b=document.getElementById('retry');let stop=false;async function connect(){stop=false;b.hidden=true;s.textContent='Đang chờ máy chủ modem khởi động...';while(!stop){try{const r=await fetch(url+'health',{cache:'no-store'});if(r.ok){location.replace(url);return}}catch(e){}await new Promise(r=>setTimeout(r,700))}b.hidden=false;s.textContent='Chưa kết nối được Node.js. Chạm nút để thử lại.'}b.onclick=connect;connect()})()</script></body></html>
